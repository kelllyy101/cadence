schema: spec-driven

# Project context: constraints that guide every OpenSpec artifact and workflow.
# Full background lives in CLAUDE.md, docs/product/VISION.md, docs/architecture/ARCHITECTURE.md
# and docs/adr/. Keep this block to rules an agent cannot infer from the code.
context: |
  Cadence is a cycle-aware training PWA for women who run and lift. It is a portfolio piece:
  code quality, UX, accessibility and privacy beat feature count.

  Privacy (non-negotiable; cycle data is GDPR Art. 9 special-category health data):
  - Cycle tracking is off by default and needs separate, explicit, versioned consent.
  - Withdrawing consent deletes cycle data and derived insights.
  - Users get a full JSON export; account deletion propagates via user.deletion_requested.
  - Collect nothing we don't use. No third-party analytics, trackers, fonts or CDNs.
  - Health data never appears in logs, errors, metrics labels or event payloads.
  - The only external processor is the Claude API for the AI workout builder (ADR-0007). It
    receives request text and equipment only, never identifiers, history or cycle data.
  - Phase is always labelled an estimate: not medical advice, not contraception.
  - Insights never imply causation and show "not enough data yet" instead of guessing.

  Engineering constraints:
  - TypeScript strict + noUncheckedIndexedAccess; no `any`.
  - Validate every external input with zod (GraphQL args, REST bodies, Kafka messages, env,
    LLM output).
  - packages/domain is pure: no I/O, frameworks, logging or Date.now() (inject a clock).
  - Schema-first GraphQL with codegen. Typed error codes: UNAUTHENTICATED, FORBIDDEN,
    BAD_USER_INPUT, NOT_FOUND, CONSENT_REQUIRED. Errors never echo health values.
  - Events use the packages/events envelope, keyed by userId, written via the outbox only.
    Consumers are idempotent.
  - Store SI units (metres, seconds, kilograms); convert only at the UI edge.
  - WCAG 2.2 AA. Touch targets at least 44x44 px. Every chart has a table alternative.
  - Ask before adding any new dependency, and say why.

rules:
  proposal:
    - Keep it under 300 words. Plain words, bullets, no restated rationale.
    - State dependencies on other changes explicitly (change name and task group).
    - Always include an Out of scope list.
  specs:
    - Requirement text is 1-2 sentences; put examples and edge cases in scenarios.
    - Write scenarios so they map one-to-one to tests named after behaviour.
    - Use synthetic examples only; never real health data.
    - Include privacy requirements (logging, export, deletion) for any capability that stores
      or transmits user data.
  design:
    - Keep it under 500 words. Point to specs and ADRs instead of repeating them.
    - Record data shapes, GraphQL SDL sketches and collection indexes here, not in specs.
    - Link to the ADR when a decision is architecture-level, or propose a new ADR.
  tasks:
    - One line per checkbox.
    - Each numbered group is one reviewable unit of 1-3 hours and one commit. The whole change
      is built on one branch, feature/<change-name>.
    - Put the legacy task ID in the group heading when one exists, e.g. "(T-00-01)".
    - Every checkbox states how it is verified (a test, a command or observable behaviour).
    - Note any new dependency in the task that introduces it, marked "(ask first)".

operations:
  apply:
    guidance:
      - Work on one task group at a time and stop for review after each group.
      - Before marking a group done, run pnpm lint, pnpm typecheck and pnpm test (plus
        test:int or e2e where the group touches them).
      - Run the code-reviewer subagent on every group; also privacy-reviewer when data, events,
        logs, export/deletion, consent or cycle copy are touched, and ux-a11y-reviewer for UI.
      - Fix every must-fix finding, then suggest a Conventional Commit message.
  archive:
    guidance:
      - Archive only after every task group is merged and the change's acceptance scenarios
        pass.
      - After archiving, check that README and CLAUDE.md still describe the system accurately.
