packages:
  - 'apps/*'
  - 'packages/*'

# Install scripts are blocked by default; allow only what's needed.
allowBuilds:
  esbuild: true # binary used by tsx
  '@apollo/protobufjs': false # postinstall not needed
  # testcontainers transitive deps: optional native builds, not needed
  cpu-features: false
  ssh2: false
  protobufjs: false
