# Local stack: `cp .env.example .env && docker compose up`.
# Host ports: Mongo 27018 (27017 is often taken by a local MongoDB), Kafka 9092, API 4000, web 5173.
name: cadence

services:
  mongo:
    image: mongo:8.0.32
    command: ['--replSet', 'rs0', '--bind_ip_all', '--wiredTigerCacheSizeGB', '0.25']
    ports: ['127.0.0.1:27018:27017']
    volumes: ['mongo-data:/data/db']
    healthcheck:
      # Initiates the single-node replica set on first run; a no-op afterwards.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "let ok; try { ok = rs.status().ok } catch (e) { ok = rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok } quit(ok === 1 ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: apache/kafka:4.3.2
    ports: ['127.0.0.1:9092:9092']
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:29093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.3.2
    depends_on:
      kafka: { condition: service_healthy }
    volumes: ['./infra/kafka/create-topics.sh:/create-topics.sh:ro']
    environment:
      BOOTSTRAP_SERVER: kafka:29092
    entrypoint: ['/bin/bash', '/create-topics.sh']
    restart: 'no'

  api:
    build: { context: ., target: dev }
    command: ['pnpm', '--filter', '@cadence/api', 'start']
    env_file: [.env]
    environment:
      MONGO_URL: mongodb://mongo:27017/cadence?replicaSet=rs0
      KAFKA_BROKERS: kafka:29092
    ports: ['127.0.0.1:4000:4000']
    depends_on:
      mongo: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  insights-worker:
    build: { context: ., target: dev }
    command: ['pnpm', '--filter', '@cadence/insights-worker', 'start']
    env_file: [.env]
    environment:
      KAFKA_BROKERS: kafka:29092
      WORKER_HEALTH_PORT: 4001
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: { context: ., target: dev }
    command: ['pnpm', '--filter', '@cadence/web', 'dev']
    environment:
      API_PROXY_TARGET: http://api:4000
    ports: ['127.0.0.1:5173:5173']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mongo-data:
